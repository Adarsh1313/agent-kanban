<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Projects and chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="views.css">
<!--
  PROTOTYPE, throwaway. Answers the "Open for the prototype" questions in
  docs/specs/projects-chats-redesign-decisions.md:
    1. Row density and the project label in Recent chats
    2. All chats: list vs table, where the project/provider filters sit
    3. How "Older" reads in the New chat picker
  Switch variants with ?v=a|b|c, the bottom bar, or the [ and ] keys.
-->
<style>
  html, body { height: 100%; overflow: hidden; }
  .app { display: flex; height: 100vh; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .sidebar .scroll { flex: 1; overflow-y: auto; margin: 0 calc(var(--space-2) * -1); padding: 0 var(--space-2) 80px; }
  .link-row { font-size: var(--text-caption); color: var(--color-text-faint); padding: 0 var(--space-2); height: 26px; border-radius: var(--radius-control); width: 100%; text-align: left; display: flex; align-items: center; gap: 4px; }
  @media (hover: hover) and (pointer: fine) { .link-row:hover { color: var(--color-text); background: var(--color-nav-hover); } }
  .proto-note { margin: 0 0 var(--space-3); font-size: var(--text-caption); color: var(--color-text-faint); }

  /* ── Recent chats rows, per variant ── */
  .rc-a .rest { flex: none; max-width: 42%; color: var(--color-text-faint); font-size: var(--text-caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-a .rest .d { display: none; }
  .rc-a:hover .rest .p { display: none; }
  .rc-a:hover .rest .d { display: inline; }

  .rc-b { height: 42px !important; align-items: flex-start !important; padding-top: 5px !important; }
  .rc-b .two { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .rc-b .two .t { line-height: 18px; }
  .rc-b .sub { display: flex; align-items: center; gap: 5px; color: var(--color-text-faint); font-size: var(--text-caption); line-height: 16px; white-space: nowrap; overflow: hidden; }
  .rc-b .sub .logo { width: 12px; height: 12px; }
  .rc-b .sub .d { display: none; }
  .rc-b:hover .sub .d { display: inline; }
  .rc-b .status, .rc-b .needs-dot { margin-top: 3px; }

  .rc-c .folder-glyph { width: 14px; height: 14px; font-size: 9px; }
  .rc-c .logo { width: 12px; height: 12px; opacity: .8; }
  .rc-c-head { font-size: var(--text-micro); color: var(--color-text-faint); padding: 6px var(--space-2) 2px 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .needs-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-needs); flex: none; }

  /* ── All chats: shared ── */
  .ac-tools { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .ac-tools .search input { width: 260px; }
  .ac-count { margin-left: auto; color: var(--color-text-faint); font-size: var(--text-caption); font-variant-numeric: tabular-nums; }
  .crow .proj { display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-muted); font-size: var(--text-caption); white-space: nowrap; width: 170px; overflow: hidden; }
  .crow .proj .folder-glyph { width: 14px; height: 14px; font-size: 9px; }
  .crow .when { width: 72px; text-align: right; color: var(--color-text-faint); font-size: var(--text-caption); font-variant-numeric: tabular-nums; }
  .src { font-size: var(--text-micro); color: var(--color-text-faint); border: 1px solid var(--color-border); border-radius: var(--radius-badge); padding: 0 4px; height: 18px; display: inline-flex; align-items: center; }
  mark { background: var(--color-needs-soft); color: inherit; border-radius: 2px; }

  /* B: table */
  .tbl { border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-surface); overflow: hidden; }
  .tr { display: grid; grid-template-columns: 22px minmax(220px, 3fr) minmax(140px, 1.4fr) 110px 90px 90px; align-items: center; gap: var(--space-3); padding: 0 var(--space-3); min-height: 38px; border-top: 1px solid var(--color-border); font-size: var(--text-body); }
  .tr.head { border-top: 0; min-height: 32px; font-size: var(--text-caption); color: var(--color-text-faint); background: var(--color-bg); }
  .tr.head button { color: inherit; font-size: inherit; display: inline-flex; align-items: center; gap: 4px; }
  .tr.head button[aria-sort] { color: var(--color-text); }
  .tr .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: var(--weight-medium); }
  .tr .c { min-width: 0; display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-muted); font-size: var(--text-caption); white-space: nowrap; overflow: hidden; }
  .tr .c .folder-glyph { width: 14px; height: 14px; font-size: 9px; }
  .tr .num { text-align: right; color: var(--color-text-faint); font-size: var(--text-caption); font-variant-numeric: tabular-nums; }
  .tr:not(.head) { cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .tr:not(.head):hover, .crow:hover { background: var(--color-surface-hover); } }
  .dd { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-control); font-size: var(--text-caption); color: var(--color-text-muted); background: var(--color-surface); }
  .dd b { color: var(--color-text); font-weight: var(--weight-medium); }
  .dd.on { border-color: var(--color-border-strong); }

  /* C: facet rail + day groups */
  .facets-wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .facets { position: sticky; top: 0; display: flex; flex-direction: column; gap: var(--space-4); }
  .facet h4 { margin: 0 0 4px; font-size: var(--text-micro); color: var(--color-text-faint); font-weight: var(--weight-medium); display: flex; }
  .facet h4 button { margin-left: auto; font-size: var(--text-micro); color: var(--color-text-muted); }
  .facet .menu-item { min-height: 26px; font-size: var(--text-caption); }
  .facet .menu-item .folder-glyph { width: 14px; height: 14px; font-size: 9px; }
  .facet .older-toggle { font-size: var(--text-micro); color: var(--color-text-faint); padding: 4px var(--space-2); }
  .day { font-size: var(--text-caption); color: var(--color-text-faint); font-weight: var(--weight-medium); margin: var(--space-4) 0 var(--space-1); }
  .day:first-child { margin-top: 0; }

  /* ── New chat picker ── */
  .picker { display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: var(--radius-card); max-height: 340px; overflow: hidden; }
  .picker .menu-search { border-bottom: 1px solid var(--color-border); }
  .picker .items { overflow-y: auto; padding: var(--space-1); }
  .picker .menu-item .folder-glyph { width: 16px; height: 16px; }
  .picker .menu-item.dim { color: var(--color-text-muted); }
  .picker .menu-item.dim .folder-glyph { opacity: .55; }
  .picker .menu-item[aria-selected="true"] { background: var(--color-control); }
  .picker .foot { border-top: 1px solid var(--color-border); padding: var(--space-2) var(--space-3); font-size: var(--text-caption); color: var(--color-text-faint); }
  .picker .older-row { color: var(--color-text-muted); }
  .picker .older-row .icon { transition: transform var(--duration-pop) var(--ease-out); }
  .picker .older-row[aria-expanded="true"] .icon.chev { transform: rotate(90deg); }
  .picker .sec { font-size: var(--text-micro); color: var(--color-text-faint); padding: var(--space-2) var(--space-2) 2px; display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; }
  .picker .sec .icon { transition: transform var(--duration-pop) var(--ease-out); }
  .picker .sec[aria-expanded="false"] .icon { transform: rotate(-90deg); }

  /* ── Variant bar ── */
  .vbar { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1); background: var(--color-ink); color: var(--color-ink-contrast); border-radius: var(--radius-full); box-shadow: var(--shadow-card-lift); font-size: var(--text-caption); }
  .vbar button { white-space: nowrap; height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-full); color: color-mix(in srgb, var(--color-ink-contrast) 70%, transparent); }
  .vbar button[aria-pressed="true"] { background: var(--color-ink-contrast); color: var(--color-ink); font-weight: var(--weight-medium); }
  .vbar .state { padding: 0 var(--space-3) 0 var(--space-2); color: color-mix(in srgb, var(--color-ink-contrast) 60%, transparent); font-family: var(--font-mono); font-size: var(--text-micro); max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 1100px) { .vbar .state { display: none; } }
  .vbar .tag { padding: 0 var(--space-2) 0 var(--space-3); font-weight: var(--weight-semibold); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Sidebar">
    <button class="workspace" type="button">
      <span class="mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg></span>
      Agent Kanban
    </button>
    <div class="side-actions">
      <button class="btn new" type="button" id="sideNew"><span data-icon="plus"></span>New chat <span class="kbd">N</span></button>
      <button class="btn icon-only ghost" type="button" id="sideSearch" aria-label="Search chats" data-tip="Search chats"><span data-icon="search"></span></button>
    </div>
    <nav class="navlist" id="nav" aria-label="Main">
      <span class="cap"></span>
      <button class="navitem" type="button" data-nav="board"><span data-icon="board"></span>Board</button>
      <button class="navitem" type="button" data-nav="all" aria-current="page"><span data-icon="inbox"></span>All chats</button>
      <button class="navitem" type="button" data-nav="projects"><span data-icon="projects"></span>Projects</button>
    </nav>
    <div class="scroll">
      <div class="side-section">
        <div class="side-title">Pinned</div>
        <div id="pinItems"></div>
      </div>
      <div class="side-section">
        <div class="side-title">Recent chats</div>
        <div id="recentItems"></div>
        <button class="link-row" type="button" id="allLink">All chats<span data-icon="chevron-right" data-size="sm"></span></button>
      </div>
      <div class="side-section">
        <div class="side-title">Providers</div>
        <div id="provItems"></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar"><span id="viewIcon"></span><h1 class="title" id="viewTitle">All chats</h1><span class="spacer"></span>
      <button class="btn primary" type="button" id="topNew"><span data-icon="plus"></span>New chat</button></header>
    <div class="view" data-view="all"><div class="page"><div class="page-inner" id="allPage"></div></div></div>
    <div class="view" data-view="board" hidden><div class="page"><div class="page-inner"><p class="proto-note">Board is unchanged by this redesign. Use All chats or New chat.</p></div></div></div>
    <div class="view" data-view="projects" hidden><div class="page"><div class="page-inner"><p class="proto-note">Projects page rules are decided (sorted by last activity, Show hidden switch). Not part of this prototype.</p></div></div></div>
  </div>
</div>

<div class="scrim" id="overlay" data-state="closed"></div>
<div class="dialog" id="dialog" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dialog-head"><h2 id="dlgT">New chat</h2><button class="btn icon-only ghost" type="button" id="dlgClose" aria-label="Close"><span data-icon="x"></span></button></div>
  <div class="dialog-body"><div id="pickerHost"></div></div>
  <div class="dialog-foot"><span class="dlg-sel" id="dlgSel" style="font-size:var(--text-caption);color:var(--color-text-muted)"></span><span class="grow"></span><button class="btn primary" type="button" id="dlgGo">Start chat</button></div>
</div>
<div class="popover menu" id="pop" data-state="closed" role="menu"></div>

<div class="vbar" role="toolbar" aria-label="Prototype variants">
  <span class="tag">PROTOTYPE</span>
  <button type="button" data-v="a">A · Compact</button>
  <button type="button" data-v="b">B · Two-line + table</button>
  <button type="button" data-v="c">C · Glyph + facets</button>
  <span class="state" id="vstate"></span>
</div>

<script src="components.js"></script>
<script>
const { icon, statusIcon, logo, PROVIDERS, bindTooltips } = KB;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const PIDS = Object.keys(PROVIDERS);
const H = 60, D = 1440;

/* ═════ Fake data (in memory only) ═════ */
const PROJECTS = [
  ['open-project', '#5b6cf0'], ['agent-kanban-site', '#16857a'], ['lila-black', '#c8402f'], ['portfolio', '#c98a12'],
  ['resume-bot', '#8a5bd6'], ['infra-scripts', '#4d7a3a'], ['Claude scratch chats', '#8a8a85'], ['notes-app', '#d2649a'],
  ['dotfiles', '#3b6fd8'], ['ml-playground', '#6b8e23'], ['old-blog', '#a0522d'], ['chrome-ext-tabs', '#2f8a8a'],
  ['leetcode', '#b8860b'], ['thesis', '#7a6a5a'],
].map(([id, colour]) => ({ id, colour }));
// [title, provider, project, minutes ago, status (null = history only), pinned]
const CHATS = [
  ['Sidebar: recent chats chat-first', 'claude', 'open-project', 2, 'running'],
  ['Hide temp-folder projects', 'codex', 'open-project', 14, 'needs'],
  ['Why does the tray icon blur at 125%?', 'claude', 'open-project', 48, 'review'],
  ['Pricing page copy pass', 'antigravity', 'agent-kanban-site', 1.5 * H, 'running'],
  ['quick regex for ISO dates', 'claude', 'Claude scratch chats', 3 * H, null],
  ['Map heatmap off by one tile', 'claude', 'lila-black', 5 * H, 'done', true],
  ['Electron auto-update spike', 'codex', 'open-project', 7 * H, 'done'],
  ['Hero image is 2MB, shrink it', 'antigravity', 'portfolio', 20 * H, null],
  ['Parse JD into bullet list', 'claude', 'resume-bot', 26 * H, 'review'],
  ['Storm-runner classifier thresholds', 'codex', 'lila-black', 30 * H, null],
  ['Rotate Cloudflare token script', 'claude', 'infra-scripts', 2 * D, 'done'],
  ['Explain zstd frame format', 'claude', 'Claude scratch chats', 2.2 * D, null],
  ['Markdown tables overflow the panel', 'codex', 'open-project', 3 * D, 'done'],
  ['Notes sync conflict on reconnect', 'antigravity', 'notes-app', 4 * D, null],
  ['Codex history index is stale', 'codex', 'open-project', 5 * D, 'done', true],
  ['Add case study: Lila Black', 'claude', 'portfolio', 6 * D, null],
  ['nvim lsp keymaps', 'claude', 'dotfiles', 9 * D, null],
  ['Cover letter tone: less formal', 'claude', 'resume-bot', 11 * D, null],
  ['Kill zone overlay colours', 'antigravity', 'lila-black', 14 * D, null],
  ['Onboarding copy, second pass', 'claude', 'open-project', 17 * D, 'done'],
  ['Backup script to R2', 'codex', 'infra-scripts', 22 * D, null],
  ['Fix vite alias on Windows', 'claude', 'agent-kanban-site', 26 * D, null],
  ['Tune learning rate schedule', 'codex', 'ml-playground', 41 * D, null],
  ['Migrate blog to Astro', 'claude', 'old-blog', 63 * D, null],
  ['Tab grouping by domain', 'antigravity', 'chrome-ext-tabs', 80 * D, null],
  ['Two-sum variants explained', 'claude', 'leetcode', 95 * D, null],
  ['Chapter 3 lit review outline', 'claude', 'thesis', 140 * D, null],
  ['Dataset loader is slow', 'codex', 'ml-playground', 44 * D, null],
].map(([title, provider, project, mins, status, pinned], i) => ({ id: i, title, provider, project, mins, status, pinned: !!pinned }));
const proj = id => PROJECTS.find(p => p.id === id);
PROJECTS.forEach(p => { p.mins = Math.min(...CHATS.filter(c => c.project === p.id).map(c => c.mins)); p.older = p.mins > 30 * D; });
PROJECTS.sort((a, b) => a.mins - b.mins);
const byRecent = (a, b) => a.mins - b.mins;

const NOW = new Date('2026-10-30T14:00:00');
function when(m) {
  if (m < 1) return 'now';
  if (m < H) return `${Math.round(m)}m`;
  if (m < D) return `${Math.round(m / H)}h`;
  if (m < 2 * D) return 'Yesterday';
  const d = new Date(NOW - m * 60000);
  return m < 7 * D ? d.toLocaleDateString('en', { weekday: 'short' }) : d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
}
const glyph = (p, size = 16) => `<span class="folder-glyph" style="background:${p.colour};width:${size}px;height:${size}px;font-size:${Math.round(size * .6)}px">${p.id[0].toUpperCase()}</span>`;
const stateMark = c => c.status === 'running' ? statusIcon('running') : c.status === 'needs' ? '<span class="needs-dot" title="Needs you"></span>' : '';
const STATUS_LABEL = { running: 'Running', needs: 'Needs you', review: 'Review', done: 'Done' };

/* ═════ State ═════ */
const VARIANTS = ['a', 'b', 'c'];
const state = {
  v: VARIANTS.includes(new URLSearchParams(location.search).get('v')) ? new URLSearchParams(location.search).get('v') : 'a',
  view: 'all', q: '', project: null, provider: null, sort: 'mins', olderOpen: false, pickQ: '', picked: 'open-project',
};

/* ═════ Sidebar ═════ */
function rowA(c) {
  return `<div class="chat-row rc-a" role="button" tabindex="0" title="${esc(c.title)}">${logo(c.provider, 'sm')}<span class="t">${esc(c.title)}</span>${stateMark(c)}
    <span class="rest"><span class="p">${esc(c.project)}</span><span class="d">${when(c.mins)}</span></span></div>`;
}
function rowB(c) {
  return `<div class="chat-row rc-b" role="button" tabindex="0"><span class="two"><span class="t">${esc(c.title)}</span>
    <span class="sub">${logo(c.provider)}${esc(c.project)}<span class="d">· ${when(c.mins)}</span></span></span>${stateMark(c)}</div>`;
}
function rowsC(list) {
  let prev = null;
  return list.map(c => {
    const head = c.project !== prev ? `<div class="rc-c-head">${esc(c.project)}</div>` : '';
    prev = c.project;
    return `${head}<div class="chat-row rc-c" role="button" tabindex="0" data-tip="${esc(c.project)} · ${when(c.mins)}">${glyph(proj(c.project), 14)}<span class="t">${esc(c.title)}</span>${stateMark(c)}${logo(c.provider)}</div>`;
  }).join('');
}
function renderSidebar() {
  const pinned = CHATS.filter(c => c.pinned).sort(byRecent);
  const recent = CHATS.filter(c => !c.pinned).sort(byRecent).slice(0, 10);
  const rows = list => state.v === 'a' ? list.map(rowA).join('') : state.v === 'b' ? list.map(rowB).join('') : rowsC(list);
  $('#pinItems').innerHTML = rows(pinned);
  $('#recentItems').innerHTML = rows(recent);
  $('#provItems').innerHTML = PIDS.map(id => `<button class="navitem prov" type="button" data-prov="${id}">${logo(id)}${PROVIDERS[id].name}<span class="meta-r">${CHATS.filter(c => c.provider === id).length}</span></button>`).join('');
  $('#provItems').querySelectorAll('[data-prov]').forEach(b => b.addEventListener('click', () => { state.provider = new Set([b.dataset.prov]); go('all'); }));
  bindTooltips($('.sidebar'));
}

/* ═════ All chats ═════ */
function filtered() {
  const q = state.q.trim().toLowerCase();
  const list = CHATS.filter(c => (!state.project || state.project.has(c.project)) && (!state.provider || state.provider.has(c.provider))
    && (!q || c.title.toLowerCase().includes(q) || c.project.toLowerCase().includes(q)));
  const k = state.sort;
  return list.sort((a, b) => k === 'mins' ? a.mins - b.mins : k === 'title' ? a.title.localeCompare(b.title) : k === 'project' ? a.project.localeCompare(b.project) || a.mins - b.mins
    : k === 'provider' ? a.provider.localeCompare(b.provider) || a.mins - b.mins : (a.status || 'z').localeCompare(b.status || 'z') || a.mins - b.mins);
}
const hl = s => { const q = state.q.trim(); if (!q) return esc(s); const i = s.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(s) : esc(s.slice(0, i)) + `<mark>${esc(s.slice(i, i + q.length))}</mark>` + esc(s.slice(i + q.length)); };
const searchBox = () => `<label class="search"><span data-icon="search" data-size="sm"></span><input id="acQ" type="search" placeholder="Search chats and projects" value="${esc(state.q)}" autocomplete="off" spellcheck="false"></label>`;
const statusCell = c => c.status ? `${statusIcon(c.status)}` : '<span class="nostate" title="History only"></span>';

function fchips() {
  const chips = [['project', 'Project', 'folder'], ['provider', 'Provider', 'globe']].filter(([k]) => state[k]).map(([k, label, ic]) => {
    const vals = [...state[k]];
    const v = vals.length === 1 ? (k === 'provider' ? `${logo(vals[0])}${PROVIDERS[vals[0]].name}` : esc(vals[0])) : `${vals.length} ${k === 'project' ? 'projects' : 'providers'}`;
    return `<span class="fchip"><span class="k">${icon(ic, 'sm')}${label}</span><span class="op">${vals.length === 1 ? 'is' : 'is any of'}</span><span class="v">${v}</span><button type="button" data-clear="${k}" aria-label="Remove ${label} filter">${icon('x', 'sm')}</button></span>`;
  });
  return chips.length ? `<div class="ac-tools">${chips.join('')}</div>` : '';
}

function allA(list) {
  return `<p class="proto-note">A: one list, Linear-style Filter menu next to search, filters show as chips below.</p>
    <div class="ac-tools">${searchBox()}<button class="chip-btn" type="button" id="filterBtn">${icon('filter', 'sm')}Filter</button><span class="ac-count">${list.length} chats</span></div>${fchips()}
    <div class="chat-list">${list.map(c => `<div class="crow">${statusCell(c)}${logo(c.provider, 'sm')}<span class="t">${hl(c.title)}</span>
      <span class="proj">${glyph(proj(c.project), 14)}${hl(c.project)}</span><span class="when">${when(c.mins)}</span></div>`).join('') || empty()}</div>`;
}
function allB(list) {
  const hd = (k, label, cls = '') => `<span class="${cls}"><button type="button" data-sort="${k}" ${state.sort === k ? 'aria-sort="ascending"' : ''}>${label}${state.sort === k ? icon('chevron-down', 'sm') : ''}</button></span>`;
  const ddLabel = (k, noun) => !state[k] ? 'Any' : state[k].size === 1 ? (k === 'provider' ? PROVIDERS[[...state[k]][0]].name : [...state[k]][0]) : `${state[k].size} ${noun}`;
  return `<p class="proto-note">B: sortable table, Project and Provider dropdowns inline with search.</p>
    <div class="ac-tools">${searchBox()}
      <button class="dd ${state.project ? 'on' : ''}" type="button" id="ddProject">${icon('folder', 'sm')}Project: <b>${esc(ddLabel('project', 'projects'))}</b>${icon('chevron-down', 'sm')}</button>
      <button class="dd ${state.provider ? 'on' : ''}" type="button" id="ddProvider">${icon('globe', 'sm')}Provider: <b>${esc(ddLabel('provider', 'providers'))}</b>${icon('chevron-down', 'sm')}</button>
      <span class="ac-count">${list.length} chats</span></div>
    <div class="tbl"><div class="tr head"><span></span>${hd('title', 'Chat')}${hd('project', 'Project')}${hd('provider', 'Provider')}${hd('status', 'Status')}${hd('mins', 'Active', 'num')}</div>
      ${list.map(c => `<div class="tr">${statusCell(c)}<span class="t">${hl(c.title)}</span><span class="c">${glyph(proj(c.project), 14)}${hl(c.project)}</span>
        <span class="c">${logo(c.provider, 'sm')}${PROVIDERS[c.provider].name}</span><span class="c">${c.status ? STATUS_LABEL[c.status] : '<span class="src">History</span>'}</span><span class="num">${when(c.mins)}</span></div>`).join('') || empty()}</div>`;
}
function allC(list) {
  const facetItem = (k, v, label, lead, n, dim) => `<button class="menu-item ${dim ? 'dim' : ''}" type="button" role="menuitemcheckbox" data-facet="${k}" data-val="${esc(v)}" aria-checked="${!!(state[k] && state[k].has(v))}"><span class="box">${icon('check')}</span>${lead}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span><span class="r">${n}</span></button>`;
  const recentP = PROJECTS.filter(p => !p.older), olderP = PROJECTS.filter(p => p.older);
  const bucket = m => m < D ? 'Today' : m < 2 * D ? 'Yesterday' : m < 7 * D ? 'This week' : m < 30 * D ? 'This month' : 'Older';
  let last = null;
  const rows = list.map(c => {
    const b = state.sort === 'mins' ? bucket(c.mins) : null, head = b && b !== last ? `<div class="day">${b}</div>` : '';
    last = b;
    return `${head}<div class="chat-list" style="border-radius:0;border-width:0 0 1px"><div class="crow">${statusCell(c)}${glyph(proj(c.project), 14)}<span class="t">${hl(c.title)}</span>
      <span class="m">${hl(c.project)}</span>${logo(c.provider, 'sm')}<span class="when">${when(c.mins)}</span></div></div>`;
  }).join('');
  return `<p class="proto-note">C: facet rail on the left (always visible counts), list grouped by day.</p>
    <div class="ac-tools">${searchBox()}<span class="ac-count">${list.length} chats</span></div>
    <div class="facets-wrap"><div class="facets">
      <div class="facet"><h4>Provider${state.provider ? '<button type="button" data-fclear="provider">Clear</button>' : ''}</h4>
        ${PIDS.map(id => facetItem('provider', id, PROVIDERS[id].name, logo(id, 'sm'), CHATS.filter(c => c.provider === id).length)).join('')}</div>
      <div class="facet"><h4>Project${state.project ? '<button type="button" data-fclear="project">Clear</button>' : ''}</h4>
        ${recentP.map(p => facetItem('project', p.id, p.id, glyph(p, 14), CHATS.filter(c => c.project === p.id).length)).join('')}
        <button class="older-toggle" type="button" id="facetOlder">${state.olderOpen ? 'Hide older' : `Older (${olderP.length})`}</button>
        ${state.olderOpen ? olderP.map(p => facetItem('project', p.id, p.id, glyph(p, 14), CHATS.filter(c => c.project === p.id).length, true)).join('') : ''}</div>
    </div><div>${rows || empty()}</div></div>`;
}
const empty = () => `<div class="page-empty">${icon('search')}<h3>No chats match</h3><p>Try a shorter search or clear the filters.</p></div>`;

function renderAll(focus) {
  const list = filtered();
  const html = state.v === 'a' ? allA(list) : state.v === 'b' ? allB(list) : allC(list);
  $('#allPage').innerHTML = html;
  $('#allPage').querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon, el.dataset.size || ''); });
  const q = $('#acQ');
  q.addEventListener('input', () => { state.q = q.value; const pos = q.selectionStart; renderAll(); const n = $('#acQ'); n.focus(); n.setSelectionRange(pos, pos); });
  if (focus) q.focus();
  $('#allPage').querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => { state[b.dataset.clear] = null; render(); }));
  $('#allPage').querySelectorAll('[data-fclear]').forEach(b => b.addEventListener('click', () => { state[b.dataset.fclear] = null; render(); }));
  $('#allPage').querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => { state.sort = b.dataset.sort; render(); }));
  $('#allPage').querySelectorAll('[data-facet]').forEach(b => b.addEventListener('click', () => { toggle(b.dataset.facet, b.dataset.val); render(); }));
  $('#facetOlder')?.addEventListener('click', () => { state.olderOpen = !state.olderOpen; render(); });
  $('#filterBtn')?.addEventListener('click', e => { e.stopPropagation(); openPop(e.currentTarget, filterRoot); });
  $('#ddProject')?.addEventListener('click', e => { e.stopPropagation(); openPop(e.currentTarget, () => checkPane('project', false)); });
  $('#ddProvider')?.addEventListener('click', e => { e.stopPropagation(); openPop(e.currentTarget, () => checkPane('provider', false)); });
}
function toggle(k, v) {
  const s = new Set(state[k] || []);
  s.has(v) ? s.delete(v) : s.add(v);
  state[k] = s.size ? s : null;
}

/* ═════ Filter menus (A: Linear-style root → pane, B: straight to checkboxes) ═════ */
const pop = $('#pop');
let popAnchor = null;
function openPop(anchor, fill) {
  popAnchor = anchor; fill();
  const r = anchor.getBoundingClientRect();
  pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 6) + 'px';
  pop.dataset.state = 'open';
}
function closePop() { pop.dataset.state = 'closed'; popAnchor = null; }
document.addEventListener('click', e => { if (!pop.contains(e.target)) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); closeDialog(); } });
function filterRoot() {
  pop.innerHTML = `<div class="pane">${[['project', 'Project', 'folder'], ['provider', 'Provider', 'globe']].map(([k, l, ic]) =>
    `<button class="menu-item" type="button" data-key="${k}">${icon(ic)}${l}<span class="r">${state[k] ? state[k].size : ''}${icon('chevron-right', 'sm')}</span></button>`).join('')}</div>`;
  pop.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => checkPane(b.dataset.key, true)));
}
function checkPane(k, back) {
  const opts = k === 'provider' ? PIDS.map(id => ({ v: id, label: PROVIDERS[id].name, lead: logo(id, 'sm'), dim: false }))
    : PROJECTS.map(p => ({ v: p.id, label: p.id, lead: glyph(p, 14), dim: p.older }));
  const recent = opts.filter(o => !o.dim), older = opts.filter(o => o.dim);
  const item = o => `<button class="menu-item" type="button" role="menuitemcheckbox" data-v="${esc(o.v)}" aria-checked="${!!(state[k] && state[k].has(o.v))}" ${o.dim ? 'style="color:var(--color-text-muted)"' : ''}><span class="box">${icon('check')}</span>${o.lead}${esc(o.label)}</button>`;
  pop.innerHTML = `<div class="pane">${back ? `<div class="menu-label"><button class="btn icon-only ghost" type="button" id="fBack" aria-label="Back" style="width:22px;height:22px">${icon('back', 'sm')}</button>${k === 'project' ? 'Project' : 'Provider'}</div>` : ''}
    ${recent.map(item).join('')}${older.length ? `<div class="menu-sep"></div><div class="menu-label">Older · no activity in 30 days</div>${older.map(item).join('')}` : ''}</div>`;
  pop.querySelector('#fBack')?.addEventListener('click', e => { e.stopPropagation(); filterRoot(); });
  pop.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); toggle(k, b.dataset.v); b.setAttribute('aria-checked', !!(state[k] && state[k].has(b.dataset.v)));
    const anchorId = popAnchor && popAnchor.id; renderAll(); renderState();
    if (anchorId) popAnchor = document.getElementById(anchorId);
  }));
}

/* ═════ New chat picker ═════ */
function pickerItem(p, dim) {
  return `<button class="menu-item ${dim ? 'dim' : ''}" type="button" role="option" data-pick="${esc(p.id)}" aria-selected="${state.picked === p.id}">${glyph(p)}${esc(p.id)}<span class="r">${when(p.mins)}${state.picked === p.id ? icon('check', 'sm') : ''}</span></button>`;
}
function renderPicker(focus) {
  const q = state.pickQ.trim().toLowerCase();
  const match = p => !q || p.id.toLowerCase().includes(q);
  const recent = PROJECTS.filter(p => !p.older && match(p)), older = PROJECTS.filter(p => p.older && match(p));
  let items = '', foot = '';
  if (state.v === 'a') {
    // A: flat list, a single "Older (n)" row at the end that unfolds in place
    items = recent.map(p => pickerItem(p)).join('');
    if (older.length) {
      const open = state.olderOpen || !!q;
      items += `<button class="menu-item older-row" type="button" id="olderRow" aria-expanded="${open}">${icon('chevron-right', 'chev')}Older<span class="r">${older.length}</span></button>`;
      if (open) items += older.map(p => pickerItem(p, true)).join('');
    }
    foot = 'A: "Older" is one row at the end; search opens it.';
  } else if (state.v === 'b') {
    // B: two labelled sections, Older collapsed with a disclosure caret
    const open = state.olderOpen || !!q;
    items = (recent.length ? `<div class="sec">Recent</div>${recent.map(p => pickerItem(p)).join('')}` : '')
      + (older.length ? `<button class="sec" type="button" id="olderRow" aria-expanded="${open}">${icon('chevron-down', 'sm')}Older · no activity in 30 days (${older.length})</button>${open ? older.map(p => pickerItem(p, true)).join('') : ''}` : '');
    foot = 'B: section headers; Older is a collapsed section.';
  } else {
    // C: older projects are not listed at all until you type
    items = recent.map(p => pickerItem(p)).join('') + (q ? older.map(p => pickerItem(p, true)).join('') : '');
    const hiddenN = PROJECTS.filter(p => p.older).length;
    foot = q ? `Searching all ${PROJECTS.length} projects.` : `${hiddenN} older projects aren't listed. Type to search them.`;
  }
  $('#pickerHost').innerHTML = `<div class="picker" role="listbox" aria-label="Project">
    <input class="menu-search" id="pickQ" type="search" placeholder="Choose a project…" value="${esc(state.pickQ)}" autocomplete="off" spellcheck="false">
    <div class="items">${items || '<div class="menu-label">No projects match</div>'}</div><div class="foot">${foot}</div></div>`;
  $('#dlgSel').innerHTML = `In <b>${esc(state.picked)}</b>`;
  const qi = $('#pickQ');
  qi.addEventListener('input', () => { state.pickQ = qi.value; renderPicker(true); renderState(); });
  if (focus) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  $('#olderRow')?.addEventListener('click', () => { state.olderOpen = !state.olderOpen; renderPicker(); renderState(); });
  $('#pickerHost').querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { state.picked = b.dataset.pick; renderPicker(); renderState(); }));
}
function openDialog() { $('#overlay').dataset.state = 'open'; $('#dialog').dataset.state = 'open'; state.pickQ = ''; renderPicker(true); renderState(); }
function closeDialog() { $('#overlay').dataset.state = 'closed'; $('#dialog').dataset.state = 'closed'; }
$('#sideNew').addEventListener('click', openDialog);
$('#topNew').addEventListener('click', openDialog);
$('#dlgClose').addEventListener('click', closeDialog);
$('#dlgGo').addEventListener('click', closeDialog);
$('#overlay').addEventListener('click', closeDialog);
document.addEventListener('keydown', e => { if ((e.key === 'n' || e.key === 'N') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); openDialog(); } });

/* ═════ Views, variants, state readout ═════ */
const VIEW_META = { all: ['inbox', 'All chats'], board: ['board', 'Board'], projects: ['projects', 'Projects'] };
function go(view, focus) {
  state.view = view;
  document.querySelectorAll('.navitem[data-nav]').forEach(n => n.toggleAttribute('aria-current', n.dataset.nav === view));
  const cap = $('#nav .cap'), cur = $(`.navitem[data-nav="${view}"]`); cap.style.transform = `translateY(${cur.offsetTop}px)`;
  document.querySelectorAll('.view').forEach(v => v.hidden = v.dataset.view !== view);
  $('#viewIcon').innerHTML = icon(VIEW_META[view][0]); $('#viewTitle').textContent = VIEW_META[view][1];
  if (view === 'all') renderAll(focus);
  renderState();
}
document.querySelectorAll('.navitem[data-nav]').forEach(n => n.addEventListener('click', () => go(n.dataset.nav)));
$('#allLink').addEventListener('click', () => go('all'));
$('#sideSearch').addEventListener('click', () => go('all', true));

function setVariant(v) {
  state.v = v; state.olderOpen = false;
  const u = new URL(location); u.searchParams.set('v', v); history.replaceState(null, '', u);
  render();
  if ($('#dialog').dataset.state === 'open') renderPicker();
}
document.querySelectorAll('.vbar [data-v]').forEach(b => b.addEventListener('click', () => setVariant(b.dataset.v)));
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const i = VARIANTS.indexOf(state.v);
  if (e.key === ']') setVariant(VARIANTS[(i + 1) % 3]);
  if (e.key === '[') setVariant(VARIANTS[(i + 2) % 3]);
});
function renderState() {
  document.querySelectorAll('.vbar [data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.v));
  const f = k => state[k] ? [...state[k]].join('|') : '·';
  $('#vstate').textContent = `v=${state.v} view=${state.view} q="${state.q}" project=${f('project')} provider=${f('provider')} sort=${state.sort} older=${state.olderOpen ? 'open' : 'closed'} pick=${state.picked}`;
}
function render() { renderSidebar(); if (state.view === 'all') renderAll(); renderState(); }

document.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon, el.dataset.size || ''); });
render();
go('all');
</script>
</body>
</html>
