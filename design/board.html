<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
<title>Agent Kanban Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body { height: 100%; overflow: hidden; }
  .app { display: flex; height: 100vh; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .usage-area { display: flex; align-items: center; gap: 2px; }
  .refresh .icon.spinning { animation: spin 700ms var(--ease-out); }
  .card.collapsing { overflow: hidden; }
  .empty-note { color: var(--color-text-faint); font-size: var(--text-caption); padding: var(--space-2) var(--space-1); }
  .no-results { flex: 1; display: grid; place-items: center; text-align: center; color: var(--color-text-muted); }
  .no-results h3 { margin: var(--space-2) 0 var(--space-1); color: var(--color-text); font-size: var(--text-title); font-weight: var(--weight-semibold); }
  .no-results p { margin: 0 0 var(--space-3); font-size: var(--text-body); }
  .sidebar .scroll { flex: 1; overflow-y: auto; margin: 0 calc(var(--space-2) * -1); padding: 0 var(--space-2); }
  .show-more-row { font-size: var(--text-caption); color: var(--color-text-faint); padding: 0 var(--space-2) 0 30px; height: 24px; border-radius: var(--radius-control); width: 100%; text-align: left; }
  @media (hover: hover) and (pointer: fine) { .show-more-row:hover { color: var(--color-text); background: var(--color-nav-hover); } }
  .crumb { color: var(--color-text-faint); font-weight: var(--weight-regular); }
  .dlg-note { font-size: var(--text-caption); color: var(--color-text-muted); display: flex; gap: 6px; align-items: center; }
  @media (max-width: 900px) { .sidebar { display: none; } }
  @media (max-width: 640px) { .usage-area .pct, .topbar .new-label, .usage-focus .m span { display: none; } }
</style>
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<div class="app">
  <!-- ───────── Sidebar ───────── -->
  <aside class="sidebar" aria-label="Sidebar">
    <button class="workspace" type="button">
      <span class="mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg></span>
      Agent Kanban <span class="chev"><span data-icon="updown"></span></span>
    </button>
    <div class="side-actions">
      <button class="btn new" type="button" id="sideNew"><span data-icon="plus"></span>New chat <span class="kbd">N</span></button>
      <button class="btn icon-only ghost" type="button" aria-label="Search chats" data-tip="Search chats"><span data-icon="search"></span></button>
    </div>
    <nav class="navlist" id="nav" aria-label="Main">
      <span class="cap"></span>
      <button class="navitem" type="button" data-nav="board" aria-current="page"><span data-icon="board"></span>Board <span class="count" id="navBoard">0</span></button>
      <button class="navitem" type="button" data-nav="projects"><span data-icon="projects"></span>Projects <span class="count" id="navProjects">0</span></button>
      <button class="navitem" type="button" data-nav="connections"><span data-icon="plug"></span>Connections <span class="count" id="navConn">3</span></button>
    </nav>

    <div class="scroll">
      <div class="side-section">
        <button class="side-title" type="button" aria-expanded="true" id="provToggle"><span data-icon="chevron-down" data-size="sm"></span>Providers</button>
        <div class="collapsible" id="provList"><div id="provItems"></div></div>
      </div>
      <div class="side-section" id="pinnedSection">
        <button class="side-title" type="button" aria-expanded="true" id="pinToggle"><span data-icon="chevron-down" data-size="sm"></span>Pinned</button>
        <div class="collapsible" id="pinList"><div id="pinItems"></div></div>
      </div>
      <div class="side-section">
        <button class="side-title" type="button" aria-expanded="true" id="recentToggle"><span data-icon="chevron-down" data-size="sm"></span>Recent chats</button>
        <div class="collapsible" id="recentList"><div id="recentItems"></div></div>
      </div>
    </div>

    <div class="side-foot">
      <button class="navitem" type="button" id="themeBtn"><span data-icon="moon"></span>Light / dark</button>
      <button class="navitem" type="button" id="settingsBtn" aria-haspopup="true" aria-expanded="false"><span data-icon="settings"></span>Settings</button>
    </div>
  </aside>

  <!-- ───────── Main ───────── -->
  <div class="main">
    <header class="topbar">
      <h1 class="title"><span id="viewIcon"><span data-icon="board"></span></span><span id="viewTitle">Board</span><span class="crumb" id="crumb"></span></h1>
      <button class="chip-btn" type="button" id="filterBtn" aria-haspopup="true" aria-expanded="false"><span data-icon="filter" data-size="sm"></span>Filter</button>
      <span class="spacer"></span>
      <div class="usage-area" id="usageArea"></div>
      <button class="btn icon-only ghost bell" type="button" id="bellBtn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications" data-tip="Notifications"><span data-icon="bell"></span><span class="dot" id="bellDot" data-n="0">0</span></button>
      <button class="btn primary" type="button" id="topNew"><span data-icon="plus"></span><span class="new-label">New chat</span> <span class="kbd">N</span></button>
    </header>
    <div class="view" id="viewBoard" data-view="board">
      <div class="filterbar" id="filterbar" hidden></div>
      <main class="board" id="board" aria-label="Board" tabindex="-1"></main>
    </div>
    <div class="view" id="viewProjects" data-view="projects" hidden><div class="page" id="projectsPage"></div></div>
    <div class="view" id="viewConnections" data-view="connections" hidden><div class="page" id="connPage"></div></div>
  </div>
</div>

<!-- Popovers -->
<div class="popover usage-pop" id="usagePop" data-state="closed" role="dialog" aria-label="Usage for all providers">
  <div class="hd"><div><b>Usage left</b><br><small id="updated">Updated just now</small></div>
    <button class="btn ghost refresh" type="button" id="refreshBtn"><span data-icon="refresh"></span>Refresh</button></div>
  <div id="usageBlocks"></div>
</div>
<div class="popover menu" id="filterPop" data-state="closed" role="menu" aria-label="Filter"></div>
<div class="popover menu" id="actionPop" data-state="closed" role="menu" aria-label="Chat actions"></div>
<div class="popover notif-pop" id="notifPop" data-state="closed" role="dialog" aria-label="Notifications">
  <div class="notif-head"><b>Notifications</b><button class="link-btn" type="button" id="markRead">Mark all read</button></div>
  <div class="notif-list" id="notifList"></div>
  <div class="notif-foot">
    <div class="toggle-row"><span data-icon="bell" data-size="sm"></span><span>Desktop notifications</span><button class="switch" type="button" role="switch" aria-checked="true" id="swNotif" aria-label="Desktop notifications"></button></div>
    <div class="toggle-row"><span data-icon="volume" data-size="sm"></span><span>Sound</span><button class="switch" type="button" role="switch" aria-checked="true" id="swSound" aria-label="Sound"></button></div>
  </div>
</div>

<!-- New chat dialog -->
<div class="scrim" id="scrim" data-state="closed"></div>
<div class="dialog" id="dialog" data-state="closed" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dialog-head"><h2 id="dlgTitle">New chat</h2><button class="btn icon-only ghost" type="button" id="dlgClose" aria-label="Close"><span data-icon="x"></span></button></div>
  <div class="dialog-body">
    <textarea id="prompt" name="prompt" autocomplete="off" placeholder="What should the agent do next? For example: add a dark mode toggle…" aria-label="Prompt"></textarea>
    <div style="display:flex;gap:var(--space-2);flex-wrap:wrap">
      <button class="chip-btn" type="button" id="projBtn" aria-haspopup="true" aria-expanded="false"></button>

  </div>
  <div class="dialog-foot"><span class="grow" style="color:var(--color-text-faint);font-size:var(--text-caption)" id="dlgHint"></span>
    <button class="btn ghost" type="button" id="dlgCancel">Cancel</button>
    <button class="btn primary" type="button" id="dlgStart">Start chat <span class="kbd">Ctrl ↵</span></button></div>
</div>
<div class="popover menu" id="dlgPop" data-state="closed" role="listbox" style="width:320px"></div>

<!-- Chat panel -->
<aside class="panel" id="panel" data-state="closed" aria-label="Chat"></aside>

<script src="components.js"></script>
<script>
const { icon, statusIcon, logo, PROVIDERS, flip, swapText, bindDisclosure, toast, bindTooltips, bindNav, level, toggleTheme, ms, css } = KB;
const $ = s => document.querySelector(s);
const PIDS = Object.keys(PROVIDERS);
const APP = { claude: 'Claude Code', codex: 'Codex', antigravity: 'Antigravity' };

/* ═════════ Data: what the app found in each provider's local history ═════════ */
const PROJECTS = [
  { id: 'open-project', path: 'C:\\Users\\Adarsh\\open-project', colour: '#6b6b66', owners: ['claude'] },
  { id: 'lila-black', path: 'C:\\Users\\Adarsh\\lila-black', colour: '#3f6fb0', owners: ['codex', 'antigravity'] },
  { id: 'local-flow', path: 'C:\\Users\\Adarsh\\local-flow', colour: '#4a8f7a', owners: ['claude', 'codex'] },
  { id: 'Portfolio', path: 'C:\\Users\\Adarsh\\Portfolio', colour: '#b5654a', owners: ['claude'] },
  { id: '20x', path: 'C:\\Users\\Adarsh\\Peakflo\\20x', colour: '#8a6ab5', owners: ['claude'] },
  { id: 'github-manage', path: 'C:\\Users\\Adarsh\\github-manage', colour: '#7a7a72', owners: ['claude'] },
];
const USAGE = {
  claude: { fiveHour: { left: 72, reset: '2:40 pm' }, weekly: { left: 58, reset: 'Thu 9:00 am' }, models: [{ name: 'Opus', window: 'weekly', left: 34, reset: 'Thu' }, { name: 'Sonnet', window: 'weekly', left: 61, reset: 'Thu' }] },
  codex: { fiveHour: { left: 31, reset: '4:10 pm' }, weekly: { left: 18, reset: 'Fri 11:00 am' }, models: [{ name: 'GPT-5 Codex', window: 'weekly', left: 18, reset: 'Fri' }, { name: 'Codex Mini', window: 'weekly', left: 64, reset: 'Fri' }] },
  antigravity: { fiveHour: { left: 88, reset: '5:55 pm' }, weekly: { left: 74, reset: 'Mon 8:00 am' }, models: [{ name: 'Gemini 3 Pro', window: '5-hour', left: 88, reset: '5:55 pm' }, { name: 'Gemini 3 Flash', window: '5-hour', left: 96, reset: '5:55 pm' }, { name: 'Claude & GPT models', window: '5-hour', left: 40, reset: '5:55 pm' }] },
};
const MODELS = { claude: ['Sonnet', 'Opus', 'Haiku'], codex: ['GPT-5 Codex', 'Codex Mini'], antigravity: ['Gemini 3 Pro', 'Gemini 3 Flash'] };
const STEPS = {
  build: [['eye', 'Reading <span class="mono">design/board.html</span>'], ['search2', 'Looking at how T3 Code lists sessions'], ['edit', 'Editing <span class="mono">components.css</span>'], ['edit', 'Editing <span class="mono">board.html</span>'], ['terminal', 'Running <span class="mono">npm test</span>'], ['check', 'Writing a summary']],
  viz: [['eye', 'Reading <span class="mono">player_events.parquet</span>'], ['edit', 'Editing <span class="mono">heatmap.ts</span>'], ['globe', 'Checking the map at phone width'], ['terminal', 'Running <span class="mono">npm run build</span>']],
  generic: [['eye', 'Reading the project'], ['search2', 'Finding the files that matter'], ['edit', 'Making the changes'], ['terminal', 'Running checks'], ['check', 'Writing a summary']],
};
let nextId = 100;
// column: null = only in the provider's own history (not on the board yet)
const chats = [
  { id: 1, title: 'AI agent Kanban board', provider: 'claude', model: 'Opus', project: 'open-project', column: 'running', steps: STEPS.build, step: 2, ago: '2m', askAt: null, files: 6 },
  { id: 2, title: 'Implement LILA BLACK player viz', provider: 'codex', model: 'GPT-5 Codex', project: 'lila-black', column: 'running', steps: STEPS.viz, step: 1, ago: '1m', askAt: 3, files: 3 },
  { id: 3, title: 'Wispr flow local setup', provider: 'codex', model: 'GPT-5 Codex', project: 'local-flow', column: 'needs', reason: 'permission', request: 'pip install faster-whisper', steps: STEPS.generic, step: 2, ago: '6m', files: 1 },
  { id: 4, title: 'Heatmap layer for match replays', provider: 'antigravity', model: 'Gemini 3 Flash', project: 'lila-black', column: 'needs', reason: 'question', question: 'Should the heatmap use the last 7 days or all matches?', steps: STEPS.generic, step: 2, ago: '12m', files: 2 },
  { id: 5, title: 'Portfolio status and live demo', provider: 'claude', model: 'Sonnet', project: 'Portfolio', column: 'review', steps: STEPS.generic, step: 4, ago: '1h', files: 4, took: '6m' },
  { id: 6, title: 'Review PRD before coding', provider: 'codex', model: 'GPT-5 Codex', project: 'lila-black', column: 'review', steps: STEPS.generic, step: 4, ago: '3h', files: 0, took: '2m' },
  { id: 7, title: 'Server restart', provider: 'claude', model: 'Haiku', project: 'Portfolio', column: 'done', steps: STEPS.generic, step: 4, ago: 'Yesterday', files: 1, took: '1m' },
  { id: 8, title: 'Settings/scratch pad UI redesign', provider: 'claude', model: 'Opus', project: 'local-flow', column: null, steps: STEPS.generic, step: 4, ago: '2d', pinned: true },
  { id: 9, title: 'Remove Peaflo repo from GitHub', provider: 'claude', model: 'Sonnet', project: '20x', column: null, steps: STEPS.generic, step: 4, ago: '3d' },
  { id: 10, title: 'Peakflo PM interview prep', provider: 'claude', model: 'Opus', project: '20x', column: null, steps: STEPS.generic, step: 4, ago: '4d' },
  { id: 11, title: '20x repo setup and overview', provider: 'claude', model: 'Sonnet', project: '20x', column: null, steps: STEPS.generic, step: 4, ago: '5d' },
  { id: 12, title: 'GitHub repos management', provider: 'claude', model: 'Sonnet', project: 'github-manage', column: null, steps: STEPS.generic, step: 4, ago: '6d' },
  { id: 13, title: 'Product management portfolio', provider: 'claude', model: 'Opus', project: 'Portfolio', column: null, steps: STEPS.generic, step: 4, ago: '1w' },
];
const find = id => chats.find(c => c.id === id);
const proj = id => PROJECTS.find(p => p.id === id);
const onBoard = c => c.column && !c.archived && !c.snoozed;
const glyph = (p, size = 16) => `<span class="folder-glyph" style="background:${p.colour};width:${size}px;height:${size}px;font-size:${Math.round(size * .6)}px">${p.id[0].toUpperCase()}</span>`;
function hydrateIcons(scope = document) { scope.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon, el.dataset.size || ''); }); }

/* ═════════ Popover manager ═════════ */
const openPops = new Set();
function openPop(pop, anchor, { align = 'left', z } = {}) {
  closePops(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.position = 'fixed'; pop.style.top = (r.bottom + 6) + 'px'; if (z) pop.style.zIndex = z;
  const w = pop.offsetWidth || 300;
  const left = align === 'right' ? r.right - w : r.left;
  pop.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + 'px';
  pop.style.setProperty('--origin', `${r.left + r.width / 2 - parseFloat(pop.style.left)}px top`);
  pop.dataset.state = 'open'; anchor.setAttribute('aria-expanded', 'true'); pop._anchor = anchor; openPops.add(pop);
}
function closePops(except) {
  openPops.forEach(p => { if (p === except) return; p.dataset.state = 'closed'; p._anchor?.setAttribute('aria-expanded', 'false'); openPops.delete(p); });
}
document.addEventListener('click', () => closePops());
document.querySelectorAll('.popover').forEach(p => p.addEventListener('click', e => e.stopPropagation()));
function togglePop(pop, anchor, opts) { if (pop.dataset.state === 'open' && pop._anchor === anchor) closePops(); else openPop(pop, anchor, opts); }

/* ═════════ Filters (single source of truth) ═════════ */
// null = not filtering on this key; a Set = only these values
const filters = { provider: null, project: null, status: null, model: null, reason: null, activity: null, source: null };
const FILTER_DEFS = {
  provider: { label: 'Provider', icon: 'plug', options: () => PIDS.map(id => ({ v: id, label: PROVIDERS[id].name, html: logo(id, 'sm') })), test: (c, s) => s.has(c.provider) },
  project: { label: 'Project', icon: 'projects', options: () => PROJECTS.map(p => ({ v: p.id, label: p.id, html: glyph(p, 14) })), test: (c, s) => s.has(c.project) },
  status: { label: 'Status', icon: 'board', options: () => [['running', 'Running'], ['needs', 'Needs you'], ['review', 'Review'], ['done', 'Done']].map(([v, label]) => ({ v, label, html: statusIcon(v) })), test: (c, s) => s.has(c.column) },
  model: { label: 'Model', icon: 'gauge', options: () => PIDS.flatMap(p => MODELS[p].map(m => ({ v: m, label: m, html: logo(p, 'sm') }))), test: (c, s) => s.has(c.model) },
  reason: { label: 'Waiting on you for', icon: 'bell', options: () => [['permission', 'Permission to run a command'], ['question', 'An answer to a question'], ['stopped', 'You stopped it'], ['limit', 'Usage limit reached']].map(([v, label]) => ({ v, label })), test: (c, s) => s.has(c.reason) },
  activity: { label: 'Last activity', icon: 'clock', single: true, options: () => [['hour', 'In the last hour'], ['today', 'Today'], ['week', 'This week']].map(([v, label]) => ({ v, label })),
    test: (c, s) => { const v = [...s][0], a = c.ago; const mins = a === 'now' ? 0 : a.endsWith('m') ? parseInt(a) : a.endsWith('h') ? parseInt(a) * 60 : a === 'Yesterday' ? 1440 : 99999; return v === 'hour' ? mins < 60 : v === 'today' ? mins < 1440 : mins < 10080; } },
  source: { label: 'Started in', icon: 'external', options: () => [['here', 'Agent Kanban'], ['native', "The provider's own app"]].map(([v, label]) => ({ v, label })), test: (c, s) => s.has(c.startedHere ? 'here' : 'native') },
};
const passes = c => Object.entries(filters).every(([k, s]) => !s || FILTER_DEFS[k].test(c, s));
const focusedProvider = () => filters.provider && filters.provider.size === 1 ? [...filters.provider][0] : null;

function setFilter(key, set, { animate = true } = {}) {
  const all = FILTER_DEFS[key].options().length;
  filters[key] = set && !(set.size === all && !FILTER_DEFS[key].single) ? set : null;
  applyFilters(animate);
}
function applyFilters(animate = true) {
  const cards = board.querySelectorAll('.card');
  const run = () => { cards.forEach(el => { el.hidden = !passes(find(+el.dataset.id)); }); refreshCounts(animate); };
  animate ? flip(cards, run) : run();
  renderFilterBar(); renderUsage(); renderSidebar();
  const fp = focusedProvider();
  $('#crumb').textContent = fp ? ` › ${PROVIDERS[fp].name}` : '';
}

function renderFilterBar() {
  const active = Object.entries(filters).filter(([, s]) => s);
  const bar = $('#filterbar');
  bar.hidden = active.length === 0;
  bar.innerHTML = active.map(([k, s]) => {
    const d = FILTER_DEFS[k], opts = d.options().filter(o => s.has(o.v));
    const op = d.single || s.size <= 1 ? 'is' : 'is any of';
    const v = s.size === 0 ? 'none selected' : opts.length <= 2 ? opts.map(o => `${o.html || ''}${o.label}`).join(', ') : `${opts.slice(0, 2).map(o => o.html || '').join('')}${opts.length} ${d.label.toLowerCase()}s`;
    return `<span class="fchip"><span class="k">${icon(d.icon, 'sm')}${d.label}</span><span class="op">${op}</span><span class="v">${v}</span><button type="button" data-clear="${k}" aria-label="Remove ${d.label} filter">${icon('x', 'sm')}</button></span>`;
  }).join('') + (active.length ? `<button class="link-btn" type="button" id="clearAll">Clear all</button>` : '');
  bar.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.clear, null)));
  $('#clearAll')?.addEventListener('click', () => { Object.keys(filters).forEach(k => filters[k] = null); applyFilters(); });
}

/* Filter menu: categories → options pane, with search, Select all / None */
const filterPop = $('#filterPop');
function filterRoot(back = false) {
  filterPop.innerHTML = `<div class="pane ${back ? 'back' : ''}"><input class="menu-search" name="filter-search" type="search" autocomplete="off" spellcheck="false" placeholder="Filter by…" aria-label="Search filters" id="fSearch">
    <div id="fItems">${Object.entries(FILTER_DEFS).map(([k, d]) => `<button class="menu-item" type="button" data-key="${k}">${icon(d.icon)}${d.label}<span class="r">${filters[k] ? (d.single ? 1 : filters[k].size) : ''}${icon('chevron-right', 'sm')}</span></button>`).join('')}</div></div>`;
  filterPop.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => filterPane(b.dataset.key)));
  const s = $('#fSearch'); s.focus({ preventScroll: true });
  s.addEventListener('input', () => {
    const q = s.value.toLowerCase();
    if (!q) return filterRoot();
    // Linear-style: typing a value jumps straight to matching options across categories
    const hits = Object.entries(FILTER_DEFS).flatMap(([k, d]) => d.options().filter(o => o.label.toLowerCase().includes(q)).map(o => ({ k, o, d })));
    $('#fItems').innerHTML = hits.length ? hits.slice(0, 8).map(({ k, o, d }) => `<button class="menu-item" type="button" data-k="${k}" data-v="${o.v}">${o.html || icon(d.icon)}${o.label}<span class="r">${d.label}</span></button>`).join('') : `<div class="menu-label">No matches</div>`;
    $('#fItems').querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { setFilter(b.dataset.k, new Set([b.dataset.v])); closePops(); }));
  });
}
function filterPane(key) {
  const d = FILTER_DEFS[key], cur = filters[key] || new Set(d.single ? [] : d.options().map(o => o.v));
  filterPop.innerHTML = `<div class="pane"><div class="menu-label"><button class="btn icon-only ghost" type="button" id="fBack" aria-label="Back" style="width:22px;height:22px">${icon('back', 'sm')}</button>${d.label}

/* ═════════ Agents (simulated events) ═════════ */

    if (c.askAt != null && c.step + 1 === c.askAt) { c.step = c.askAt; moveTo(c, 'needs', { reason: 'permission', request: 'npm run build', askAt: null }); notify(c, 'permission'); syncPanel(c); return; }
    if (c.step + 1 >= c.steps.length) { moveTo(c, 'review', { reason: null, took: '4m', files: c.files || 2 }); notify(c, 'finished'); syncPanel(c); return; }

/* ═════════ Drag to Done ═════════ */
function bindDrag(el) {

  wh.addEventListener('click', () => setWh(wh.getAttribute('aria-expanded') !== 'true')); setWh(wh.getAttribute('aria-expanded') === 'true');

    e.stopPropagation(); const a = b.dataset.p;
    if (a === 'close') closePanel();
    if (a === 'stop') stopChat(c, b);
    if (a === 'resume' || a === 'allow' || a === 'deny') resumeChat(c);
    if (a === 'done') { moveTo(c, 'done', { reason: null }); syncPanel(c); }
    if (a === 'more') openActions(c, b);
    if (a === 'native') toast(`Opens this same chat in ${APP[c.provider]}`);
    if (a === 'send') sendMessage(c);
  }));
  const ta = panel.querySelector('textarea');
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(c); } });
  bindTooltips(panel);
}
function sendMessage(c) {
  const ta = panel.querySelector('textarea'), text = ta.value.trim(); if (!text) return;
  ta.value = '';
  const m = document.createElement('div'); m.className = 'msg user'; m.style.animation = 'rise var(--duration-pop) var(--ease-out)'; m.textContent = text;
  const thread = panel.querySelector('.thread'); thread.append(m); thread.scrollTop = thread.scrollHeight;
  if (c.column !== 'running') { c.steps = STEPS.generic; c.step = 0; setTimeout(() => { moveTo(c, 'running', { reason: null }); syncPanel(c); }, 350); }
}
function openPanel(id) {
  const c = find(id); if (!c) return;
  openId = id; panel.innerHTML = panelHtml(c); wirePanel(c); panel.dataset.state = 'open';
  board.querySelectorAll('.card[aria-selected]').forEach(x => x.removeAttribute('aria-selected')); cardEl(id)?.setAttribute('aria-selected', 'true');
  renderSidebar();
}
function syncPanel(c) {
  if (openId !== c.id) return;
  const keep = panel.querySelector('textarea')?.value || '';
  panel.innerHTML = panelHtml(c); wirePanel(c); panel.querySelector('textarea').value = keep;
  cardEl(c.id)?.setAttribute('aria-selected', 'true');
}
function closePanel() { panel.dataset.state = 'closed'; openId = null; board.querySelectorAll('.card[aria-selected]').forEach(x => x.removeAttribute('aria-selected')); renderSidebar(); }

/* ═════════ Usage: all chips, or one provider when it's focused ═════════ */
const score = id => Math.min(USAGE[id].fiveHour.left, USAGE[id].weekly.left);
const suggestFrom = ids => [...ids].sort((a, b) => score(b) - score(a))[0];
function renderUsage() {
  const fp = focusedProvider(), area = $('#usageArea');
  if (fp) {
    const u = USAGE[fp];
    area.innerHTML = `<span class="usage-focus" aria-label="${PROVIDERS[fp].name} usage">${logo(fp, 'sm')}
      <span class="m" data-level="${level(u.fiveHour.left)}"><span>5-hour</span><i style="--left:${u.fiveHour.left / 100}"></i><b>${u.fiveHour.left}%</b></span>
      <span class="m" data-level="${level(u.weekly.left)}"><span>Weekly</span><i style="--left:${u.weekly.left / 100}"></i><b>${u.weekly.left}%</b></span></span>
      <button class="link-btn" type="button" id="allUsage" aria-haspopup="true" aria-expanded="false">${icon('gauge', 'sm')}Usage for all providers</button>`;
    $('#allUsage').addEventListener('click', e => { e.stopPropagation(); togglePop($('#usagePop'), e.currentTarget, { align: 'right' }); });
  } else {
    area.innerHTML = PIDS.map(id => { const u = USAGE[id]; return `<button class="usage-chip" type="button" data-prov="${id}" aria-haspopup="true" aria-expanded="false" aria-label="${PROVIDERS[id].name}: ${score(id)}% left">${logo(id, 'sm')}<span class="minimeter" aria-hidden="true"><i data-level="${level(u.fiveHour.left)}" style="--left:${u.fiveHour.left / 100}"></i><i data-level="${level(u.weekly.left)}" style="--left:${u.weekly.left / 100}"></i></span><span class="pct">${score(id)}%</span></button>`; }).join('');
    area.querySelectorAll('.usage-chip').forEach(ch => ch.addEventListener('click', e => { e.stopPropagation(); togglePop($('#usagePop'), ch, { align: 'right' }); }));
  }
}
const meter = (name, w) => `<div class="meter" data-level="${level(w.left)}"><span class="name">${name}</span><span class="val">${w.left}% left</span><span class="track"><span class="fill" style="--left:${w.left / 100}"></span></span><span class="reset">Resets ${w.reset}</span></div>`;
function renderUsageBlocks() {
  const best = suggestFrom(PIDS);
  $('#usageBlocks').innerHTML = PIDS.map(id => { const u = USAGE[id], p = PROVIDERS[id];
    return `<div class="prov-block"><div class="prov-head">${logo(id)}${p.name} <span class="plan">${p.plan}</span>${best === id ? '<span class="state suggested">Most room</span>' : ''}</div>
      ${meter('5-hour', u.fiveHour)}${meter('Weekly', u.weekly)}
      <button class="model-toggle" type="button" aria-expanded="false">${icon('chevron-right', 'sm')}By model</button>
      <div class="collapsible closed"><div><div class="models">${u.models.map(m => meter(`${m.name} · ${m.window}`, m)).join('')}</div></div></div></div>`; }).join('');
  $('#usageBlocks').querySelectorAll('.model-toggle').forEach(b => bindDisclosure(b, b.nextElementSibling));
}
$('#refreshBtn').addEventListener('click', () => {
  const ic = $('#refreshBtn .icon'); ic.classList.remove('spinning'); ic.offsetWidth; ic.classList.add('spinning'); $('#updated').textContent = 'Checking…';
  setTimeout(() => { PIDS.forEach(id => { USAGE[id].fiveHour.left = Math.max(2, USAGE[id].fiveHour.left - 2); }); renderUsageBlocks(); renderUsage(); $('#updated').textContent = 'Updated just now'; }, 700);
});

/* ═════════ Sidebar: providers, pinned, recent chats by project ═════════ */
const expandedProjects = new Set();
function chatRow(c) {
  const st = c.column === 'running' ? statusIcon('running') : c.column === 'needs' ? `<span class="state-dot" style="width:6px;height:6px;border-radius:50%;background:var(--color-needs);flex:none" title="Needs you"></span>` : '';
  return `<div class="chat-row" role="button" tabindex="0" data-chat="${c.id}" title="${c.title}" ${openId === c.id ? 'aria-current="true"' : ''}>${logo(c.provider, 'sm')}<span class="t">${c.title}</span>${st}
    <button class="row-more" type="button" aria-label="More actions for ${c.title}">${icon('more', 'sm')}</button></div>`;
}
function renderSidebar() {
  const fp = focusedProvider();
  $('#provItems').innerHTML = PIDS.map(id => `<button class="navitem prov" type="button" data-prov="${id}" aria-pressed="${fp === id}">${logo(id)}${PROVIDERS[id].name}<span class="meta-r">${chats.filter(c => c.provider === id && !c.archived).length}</span></button>`).join('');
  $('#provItems').querySelectorAll('[data-prov]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.prov; setFilter('provider', focusedProvider() === id ? null : new Set([id]));
  }));
  const pinned = chats.filter(c => c.pinned && !c.archived);
  $('#pinnedSection').hidden = pinned.length === 0;
  $('#pinItems').innerHTML = pinned.map(chatRow).join('');
  // Only chats from connected agents the user chose to show (set on Connections or during onboarding)
  const shown_ = c => typeof CONN === 'undefined' || (CONN[c.provider].state === 'connected' && CONN[c.provider].showChats);
  const visible = chats.filter(c => !c.archived && (!fp || c.provider === fp) && shown_(c));
  // Most recently active projects first; only the top few, the rest live on the Projects page
  const minsOf = a => a === 'now' ? 0 : /m$/.test(a) ? parseInt(a) : /h$/.test(a) ? parseInt(a) * 60 : a === 'Yesterday' ? 1440 : /d$/.test(a) ? parseInt(a) * 1440 : /w$/.test(a) ? parseInt(a) * 10080 : 99999;
  const recent = c => minsOf(c.ago);
  const groups = PROJECTS.map(p => ({ p, list: visible.filter(c => c.project === p.id && !c.pinned).sort((a, b) => recent(a) - recent(b)) }))
    .filter(g => g.list.length).sort((a, b) => recent(a.list[0]) - recent(b.list[0]));
  const MAX_PROJECTS = 4, MAX_CHATS = 3;
  $('#recentItems').innerHTML = groups.slice(0, MAX_PROJECTS).map(({ p, list }) => {
    const open = expandedProjects.has(p.id), shown = open ? list : list.slice(0, MAX_CHATS);
    return `<div class="proj"><div class="proj-row" data-proj="${p.id}" title="Open ${p.id}"><span class="name">${p.id}</span>
        <button class="add" type="button" data-newin="${p.id}" aria-label="New chat in ${p.id}" data-tip="New chat in ${p.id}">${icon('plus', 'sm')}</button></div>
      ${shown.map(chatRow).join('')}
      ${list.length > MAX_CHATS ? `<button class="show-more-row" type="button" data-expand="${p.id}">${open ? 'Show less' : `${list.length - MAX_CHATS} more`}</button>` : ''}</div>`;
  }).join('') + (groups.length > MAX_PROJECTS ? `<button class="show-more-row all-projects" type="button" id="allProjects">All projects${icon('chevron-right', 'sm')}</button>` : '');
  $('#allProjects')?.addEventListener('click', () => go('projects'));
  document.querySelectorAll('.sidebar .chat-row').forEach(r => {
    r.addEventListener('click', () => openPanel(+r.dataset.chat));
    r.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === r) openPanel(+r.dataset.chat); });
    r.querySelector('.row-more').addEventListener('click', e => { e.stopPropagation(); openActions(find(+r.dataset.chat), e.currentTarget); });
  });
  document.querySelectorAll('[data-newin]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openDialog(b.dataset.newin); }));
  document.querySelectorAll('.sidebar .proj-row').forEach(r => r.addEventListener('click', () => go('projects', r.dataset.proj)));
  document.querySelectorAll('[data-expand]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.expand; expandedProjects.has(id) ? expandedProjects.delete(id) : expandedProjects.add(id); renderSidebar(); }));
  bindTooltips(document.querySelector('.sidebar'));
}
/* ═════════ Views: Board · Projects · Connections ═════════ */
const VIEW_META = { board: ['board', 'Board'], projects: ['projects', 'Projects'], connections: ['plug', 'Connections'] };
let currentView = 'board', pendingArg = null;
function showView(name, arg) {
  closePops();
  const changed = name !== currentView; currentView = name;
  document.querySelectorAll('.view').forEach(v => v.hidden = v.dataset.view !== name);
  $('#viewIcon').innerHTML = icon(VIEW_META[name][0]); $('#viewTitle').textContent = VIEW_META[name][1];
  $('#filterBtn').hidden = name !== 'board';
  $('#crumb').textContent = name === 'board' && focusedProvider() ? ` › ${PROVIDERS[focusedProvider()].name}` : '';
  if (name === 'projects') { if (!arg && changed) projectsState.mode = 'list'; renderProjects(arg); }
  if (name === 'connections') renderConnections();
  if (name === 'board' && changed) { const v = $('#viewBoard'); v.classList.remove('entering'); v.offsetWidth; v.classList.add('entering'); }
}
// Programmatic navigation goes through the nav so the capsule slides too
function go(name, arg) { pendingArg = arg; document.querySelector(`.navitem[data-nav="${name}"]`).click(); }
bindNav($('#nav'), it => { const a = pendingArg; pendingArg = null; showView(it.dataset.nav, a); });
[['#provToggle', '#provList'], ['#pinToggle', '#pinList'], ['#recentToggle', '#recentList']].forEach(([t, l]) => bindDisclosure($(t), $(l)));
$('#themeBtn').addEventListener('click', toggleTheme);

/* ═════════ New chat: project first, then a provider that knows it ═════════ */
const draft = { project: 'open-project', provider: 'claude', model: 'Opus' };
const dlgPop = $('#dlgPop');
const allowedProviders = () => proj(draft.project).owners;
function pickProvider() { draft.provider = suggestFrom(allowedProviders()); draft.model = MODELS[draft.provider][0]; }
function renderDialog() {
  const p = proj(draft.project), allowed = allowedProviders(), best = suggestFrom(allowed);
  $('#projBtn').innerHTML = `${glyph(p, 14)}${p.id}${icon('chevron-down', 'sm')}`;
  $('#provBtn').innerHTML = `${logo(draft.provider, 'sm')}${PROVIDERS[draft.provider].name}${draft.provider === best && allowed.length > 1 ? ' <span class="suggested">Suggested</span>' : ''}${icon('chevron-down', 'sm')}`;
  $('#modelBtn').innerHTML = `${draft.model}${icon('chevron-down', 'sm')}`;
  const u = USAGE[draft.provider];
  $('#dlgHint').textContent = `${PROVIDERS[draft.provider].name}: ${u.fiveHour.left}% of 5-hour · ${u.weekly.left}% of weekly left`;
  $('#dlgNote').innerHTML = allowed.length < PIDS.length ? `${icon('projects', 'sm')}${p.id} has been worked on with ${allowed.map(a => PROVIDERS[a].name).join(' and ')}, so ${allowed.length > 1 ? 'those are' : 'that’s'} the provider${allowed.length > 1 ? 's' : ''} that know${allowed.length > 1 ? '' : 's'} it.` : '';
}
function dlgMenu(kind, anchor) {
  if (kind === 'project') {
    dlgPop.innerHTML = `<div class="pane"><div class="menu-label">Projects found on this computer</div>${PROJECTS.map(p => `<button class="menu-item" type="button" data-proj="${p.id}">${glyph(p, 14)}<span style="flex:1">${p.id}</span><span class="r">${p.owners.map(o => logo(o, 'sm')).join('')}${draft.project === p.id ? icon('check', 'sm') : ''}</span></button>`).join('')}
      <div class="menu-sep"></div><button class="menu-item" type="button" data-proj="__new">${icon('folder')}Choose another folder…</button></div>`;
    dlgPop.querySelectorAll('[data-proj]').forEach(b => b.onclick = () => { if (b.dataset.proj === '__new') { toast('Opens the folder picker. A new folder works with any provider'); return; } draft.project = b.dataset.proj; if (!allowedProviders().includes(draft.provider)) pickProvider(); renderDialog(); closePops(); });
  }
  if (kind === 'provider') {
    const allowed = allowedProviders(), best = suggestFrom(allowed);
    dlgPop.innerHTML = `<div class="pane"><div class="menu-label">Start on</div>${PIDS.map(id => { const x = USAGE[id], ok = allowed.includes(id);
      return `<button class="pick-row" type="button" data-prov="${id}" aria-selected="${draft.provider === id}" ${ok ? '' : 'aria-disabled="true"'}>${logo(id, 'lg')}<span class="t"><b>${PROVIDERS[id].name}${ok && best === id && allowed.length > 1 ? '<span class="suggested">Suggested</span>' : ''}</b>
        <small>${ok ? `${x.fiveHour.left}% of 5-hour · ${x.weekly.left}% of weekly left` : `Hasn’t worked on ${draft.project} yet`}</small></span>
        ${ok ? `<span class="minimeter" aria-hidden="true"><i data-level="${level(x.fiveHour.left)}" style="--left:${x.fiveHour.left / 100}"></i><i data-level="${level(x.weekly.left)}" style="--left:${x.weekly.left / 100}"></i></span>` : ''}<span class="check">${icon('check', 'sm')}</span></button>`; }).join('')}</div>`;
    dlgPop.querySelectorAll('[data-prov]').forEach(b => b.onclick = () => { if (b.getAttribute('aria-disabled') === 'true') return; draft.provider = b.dataset.prov; draft.model = MODELS[draft.provider][0]; renderDialog(); closePops(); });
  }
  if (kind === 'model') {
    dlgPop.innerHTML = `<div class="pane"><div class="menu-label">${PROVIDERS[draft.provider].name} models</div>${MODELS[draft.provider].map(m => { const lim = USAGE[draft.provider].models.find(x => x.name === m);
      return `<button class="pick-row" type="button" data-model="${m}" aria-selected="${draft.model === m}"><span class="t"><b>${m}</b><small>${lim ? `${lim.left}% of ${lim.window} left` : 'Shares the plan limit'}</small></span><span class="check">${icon('check', 'sm')}</span></button>`; }).join('')}</div>`;
    dlgPop.querySelectorAll('[data-model]').forEach(b => b.onclick = () => { draft.model = b.dataset.model; renderDialog(); closePops(); });
  }
  togglePop(dlgPop, anchor, { z: 65 });
}
[['#projBtn', 'project'], ['#provBtn', 'provider'], ['#modelBtn', 'model']].forEach(([s, k]) => $(s).addEventListener('click', e => { e.stopPropagation(); dlgMenu(k, e.currentTarget); }));
function openDialog(projectId) {
  closePops();
  const fp = focusedProvider();
  draft.project = projectId || (fp ? PROJECTS.find(p => p.owners.includes(fp)).id : 'open-project');
  pickProvider();
  if (fp && allowedProviders().includes(fp)) { draft.provider = fp; draft.model = MODELS[fp][0]; }
  renderDialog();
  $('#scrim').dataset.state = 'open'; $('#dialog').dataset.state = 'open'; $('#prompt').focus({ preventScroll: true });
}
function closeDialog() { $('#scrim').dataset.state = 'closed'; $('#dialog').dataset.state = 'closed'; closePops(); }
function startChat() {
  const text = $('#prompt').value.trim();
  if (!text) { $('#prompt').focus(); if (!KB.reduced()) $('#prompt').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 200 }); return; }
  const c = { id: nextId++, title: text.charAt(0).toUpperCase() + text.slice(1, 60), provider: draft.provider, model: draft.model, project: draft.project, column: 'running', steps: STEPS.generic, step: 0, ago: 'now', askAt: null, startedHere: true };
  chats.unshift(c); $('#prompt').value = ''; closeDialog();
  if (!passes(c)) { Object.keys(filters).forEach(k => filters[k] = null); applyFilters(false); }
  const card = makeCard(c); card.classList.add('new');
  setTimeout(() => flip(board.querySelectorAll('.card'), () => { colBody('running').prepend(card); refreshCounts(); }).then(renderSidebar), 120);
}
$('#scrim').addEventListener('click', closeDialog); $('#dlgClose').addEventListener('click', closeDialog); $('#dlgCancel').addEventListener('click', closeDialog); $('#dlgStart').addEventListener('click', startChat);
$('#prompt').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) startChat(); });
$('#dialog').addEventListener('click', e => { if (!e.target.closest('.chip-btn')) closePops(); });
['#sideNew', '#topNew'].forEach(s => $(s).addEventListener('click', e => { e.stopPropagation(); openDialog(); }));

/* ═════════ Keyboard ═════════ */
document.addEventListener('keydown', e => {
  if (document.getElementById('onb')?.dataset.state === 'open') return;
  const typing = e.target instanceof Element && e.target.matches('input, textarea');
  if (e.key === 'Escape') { if (openPops.size) closePops(); else if ($('#dialog').dataset.state === 'open') closeDialog(); else if (openId) closePanel(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openDialog(); }
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); filterRoot(); openPop(filterPop, $('#filterBtn')); }
});

/* ═════════ Boot ═════════ */
hydrateIcons();
buildColumns();
renderBoard();
renderSidebar();
renderUsage();
renderUsageBlocks();
renderNotifs();
renderFilterBar();
bindTooltips();
</script>

<script src="connections.js"></script>
